# Place in: CreditScoringSystem/docker-compose.yml  (the project root)
# Starts three containers: db (Postgres), backend (Django + Gunicorn), frontend (nginx + React build).

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: credit_scoring_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: change-me        # must equal DB_PASSWORD in backend/.env
    volumes:
      - pgdata:/var/lib/postgresql/data   # keeps your data when containers are rebuilt
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d credit_scoring_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: ./backend/.env
    depends_on:
      db:
        condition: service_healthy        # wait until Postgres accepts connections
    # No "ports": only nginx talks to the backend, over Docker's internal network.

  frontend:
    build:
      context: ./frontend/credit-scoring-frontend
      args:
        VITE_API_URL: http://localhost:8080   # baked into the React build (Vite reads it at build time)
    restart: unless-stopped
    ports:
      - "8080:80"                         # open http://localhost:8080
    depends_on:
      - backend

volumes:
  pgdata:
