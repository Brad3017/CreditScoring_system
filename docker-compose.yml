# Place in: CreditScoringSystem/docker-compose.yml  (the project root)

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: credit_scoring_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres      # must equal DB_PASSWORD in backend/.env
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d credit_scoring_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: ./backend/.env
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend/credit-scoring-frontend
      args:
        VITE_API_URL: /api                # relative, so the browser calls nginx on the same address
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  pgdata:
